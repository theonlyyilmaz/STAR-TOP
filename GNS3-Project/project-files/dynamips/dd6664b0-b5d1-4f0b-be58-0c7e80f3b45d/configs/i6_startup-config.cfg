!
!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address 10.255.0.33 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 10.255.0.26 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 10.255.0.29 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet3/0
 ip address 10.255.0.18 255.255.255.252
 duplex auto
 speed auto
!
router ospf 1
 log-adjacency-changes
 network 10.255.0.16 0.0.0.3 area 0
 network 10.255.0.24 0.0.0.3 area 0
 network 10.255.0.28 0.0.0.3 area 0
 network 10.255.0.32 0.0.0.3 area 0
!
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
